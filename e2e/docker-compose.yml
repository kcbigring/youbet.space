# Postgres for the end-to-end harness. Nothing here is precious — the harness
# drops and recreates the schema on every run, and the port is deliberately not
# 5432 so it cannot collide with a database anyone cares about.
services:
  db:
    image: postgres:16-alpine
    container_name: youbet-e2e-db
    environment:
      POSTGRES_USER: youbet
      POSTGRES_PASSWORD: youbet
      POSTGRES_DB: youbet_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youbet -d youbet_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
