name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Contracts: install & compile
        working-directory: ./contracts
        run: |
          npm ci
          npx hardhat compile

      - name: Contracts: run tests
        working-directory: ./contracts
        run: |
          npm ci
          npx hardhat test

      - name: API: install & build
        working-directory: ./api
        run: |
          npm ci
          npx prisma generate || true
          npm run build

      - name: Web: install & build
        working-directory: ./web
        run: |
          npm ci
          npm run build
