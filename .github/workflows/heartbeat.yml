name: Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather repo status
        run: |
          echo "LAST_COMMIT=$(git log -1 --pretty=format:'%h - %s (%an)')" >> $GITHUB_ENV
          FILES=$(git --no-pager log -1 --name-only --pretty="")
          # convert newlines to comma-separated list
          echo "FILES_CHANGED=$(echo "$FILES" | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV

      - name: Write heartbeat file
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'HEARTBEAT.md';
            const content = `# Heartbeat

Time: ${new Date().toISOString()}

Last commit: ${process.env.LAST_COMMIT}

Files changed: ${process.env.FILES_CHANGED || 'none'}

Current status: Run contract compile & tests blocked by local npm registry 403. API: `/invite` and `/verify` added; Twilio helper added. Frontend: invite UI + deploy/create forms present. Contracts: `Wager` and `WagerFactory` updated to support ownerSplitBps and bond redistribution.

Next steps: try running tests in CI or fix npm registry locally; run full integration tests; deploy compiled artifacts when ready.
`;

            // try to get existing file to decide create vs update
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path });
              const sha = existing.data.sha;
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: `heartbeat update ${new Date().toISOString()}`, content: Buffer.from(content).toString('base64'), sha, committer: { name: 'youbet-bot', email: 'youbet-bot@example.com' }, author: { name: 'youbet-bot', email: 'youbet-bot@example.com' } });
            } catch (e) {
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: `heartbeat create ${new Date().toISOString()}`, content: Buffer.from(content).toString('base64'), committer: { name: 'youbet-bot', email: 'youbet-bot@example.com' }, author: { name: 'youbet-bot', email: 'youbet-bot@example.com' } });
            }
