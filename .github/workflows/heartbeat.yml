name: Heartbeat

# Writes a short status beacon into HEARTBEAT.md. Hourly rather than every five
# minutes: a scheduled commit is a commit, and 288 of them a day buries real work.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write heartbeat
        run: |
          {
            echo "# Heartbeat"
            echo
            echo "Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Last commit: $(git log -1 --pretty=format:'%h %s (%an, %ar)')"
            echo
            echo "## Recent activity"
            echo
            git log -5 --pretty=format:'- %h %s' | cat
            echo
            echo
            echo "## Files touched in the last commit"
            echo
            git show --name-only --pretty="" HEAD | sed 's/^/- /'
          } > HEARTBEAT.md

      - name: Commit if the beacon moved
        run: |
          if git diff --quiet HEARTBEAT.md; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name "youbet-bot"
          git config user.email "youbet-bot@users.noreply.github.com"
          git add HEARTBEAT.md
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
